services:
    sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        container_name: sqlserver
        environment:
            SA_PASSWORD: "FCG@admin"
            ACCEPT_EULA: "Y"
            MSSQL_PID: "Developer"
        ports:
            - "1433:1433"
        networks:
            - fcg-network
        healthcheck:
            test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'FCG@admin' -C -Q 'SELECT 1' || exit 1"]
            interval: 10s
            timeout: 5s
            retries: 5
        volumes:
            - sqlserver-data:/var/opt/mssql
    elasticsearch:
        image: docker.elastic.co/elasticsearch/elasticsearch:9.2.0
        container_name: elasticsearch
        environment:
            - discovery.type=single-node
            - xpack.security.enabled=false
            - ES_JAVA_OPTS=-Xms512m -Xmx512m
        ports:
            - "9200:9200" 
        volumes:
            - elasticsearch-data:/usr/share/elasticsearch/data
        networks:
            - fcg-network
    mongo:
        image: mongo:latest
        container_name: mongodb
        restart: always
        ports:
          - "27017:27017"
        environment:
          MONGO_INITDB_ROOT_USERNAME: admin
          MONGO_INITDB_ROOT_PASSWORD: admin123
        volumes:
          - mongo-data:/data/db
        networks:
          - fcg-network
    rabbitmq:
        image: rabbitmq:4.2.1-management
        container_name: rabbitmq
        ports:
          - "5672:5672"     # Porta do protocolo AMQP
          - "15672:15672"   # Painel de administracao
        environment:
          RABBITMQ_DEFAULT_USER: admin
          RABBITMQ_DEFAULT_PASS: admin123
        volumes:
          - rabbitmq-data:/var/lib/rabbitmq
          - ./rabbitmq/definitions.json:/etc/rabbitmq/definitions.json
          - ./rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf
        networks:
          - fcg-network
    fcg-user-api:
        container_name: fcg-user-api
        build:
          context: ./users-api/
          dockerfile: ./FCG.User.API/Dockerfile
        ports:
          - "5001:8080"
        depends_on:
          sqlserver:
            condition: service_healthy
        environment:
          ASPNETCORE_ENVIRONMENT: Development
          ConnectionStrings__DefaultConnection: "Server=sqlserver;Initial Catalog=FCG;User Id=sa;Password=FCG@admin;TrustServerCertificate=true"
        networks:
          - fcg-network
        restart: on-failure
    fcg-user-worker:
        container_name: fcg-user-worker
        build:
            context: ./users-api/
            dockerfile: ./FCG.User.Worker/Dockerfile
        environment:
            ASPNETCORE_ENVIRONMENT: Development
            ConnectionStrings__DefaultConnection: "Server=sqlserver;Initial Catalog=FCG;User Id=sa;Password=FCG@admin;TrustServerCertificate=true"
        restart: on-failure
        networks:
          - fcg-network
        depends_on:
          rabbitmq:
            condition: service_started
    fcg-game-api:
        container_name: fcg-games-api
        build:
            context: ./games-api/
            dockerfile: ./src/FCG.Games.API/Dockerfile
        ports:
            - "5002:8080"
        depends_on:
            sqlserver:
                condition: service_healthy
            elasticsearch:
                condition: service_started
        environment:
            ASPNETCORE_ENVIRONMENT: Development
            RabbitMq__Settings__HostName: rabbitmq
            RabbitMq__Settings__Port: 5672
            RabbitMq__Settings__UserName: admin
            RabbitMq__Settings__Password: admin123
        networks:
            - fcg-network
        restart: on-failure
    fcg-games-worker:
        container_name: fcg-games-worker
        build:
            context: ./games-api/
            dockerfile: ./FCG.Games.Worker/Dockerfile
        environment:
            ASPNETCORE_ENVIRONMENT: Development
        restart: on-failure
        networks:
          - fcg-network
        depends_on:
          rabbitmq:
            condition: service_started
    fcg-payments-api:
        container_name: fcg-payments-api
        build:
          context: ./payments-api/
          dockerfile: ./FCG.Payments.API/Dockerfile
        ports:
          - "5003:8080"
        depends_on:
          - mongo
          - rabbitmq
        environment:
          MongoDbSettings__ConnectionString: mongodb://admin:admin123@mongo:27017  
          MongoDbSettings__DatabaseName: FCGPaymentsDb
          ASPNETCORE_ENVIRONMENT: Development
          RabbitMq__Settings__HostName: rabbitmq
          RabbitMq__Settings__Port: 5672
          RabbitMq__Settings__UserName: admin
          RabbitMq__Settings__Password: admin123
        networks:
          - fcg-network
        restart: on-failure
    fcg-payments-worker:
      container_name: fcg-payments-worker
      build:
        context: ./payments-api/
        dockerfile: ./FCG.Payments.Worker/Dockerfile
      restart: always
      networks:
        - fcg-network
      environment:
        MongoDbSettings__ConnectionString: mongodb://admin:admin123@mongo:27017  
        MongoDbSettings__DatabaseName: FCGPaymentsDb
        RabbitMq__Settings__HostName: rabbitmq
      depends_on:
        rabbitmq:
          condition: service_started
networks:
  fcg-network:
    external: false
volumes:
  elasticsearch-data:
  sqlserver-data:
  mongo-data:
  rabbitmq-data: